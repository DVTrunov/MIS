<h1><font color="#000080">Регистр сведений "Назначения свойств объектов"</font></h1>
<p style="MARGIN-RIGHT: 0px" dir="ltr"><font size="2">Регистр позволяет хранить информацию о присвоении свойств конкретным объектам справочников или документов в разрезе объектов и свойств. <br>Регистр является непериодическим.</font></p>
<p><font size="2">Записи формируются и заносятся непосредственно, без использования регистратора.</font></p></body></html>
