<h1><font color="#000080">Регистр сведений "Подготовка к исследованию пациента"</font></h1>
<p><font size="2">Регистр хранит подготовку к исследованию внешней лаборатории в разрезе анализов. Заполнение регистра осуществляется не вручную, а интеграционными механизмами конкретной внешней лаборатории.</font></p></body></html>
